name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: 语义规格 + 双实现对拍
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️⚠️ **别再用 `swift-actions/setup-swift`**（2026-10-24 栽过）
      #   `ubuntu-latest` 已经换成 **Ubuntu 26.04** ⇒ setup-swift 的 OS 支持表里没有它
      #   ⇒ 直接报「Error: Version "26.04" of Ubuntu is not supported」
      #   ⇒ **这个 job 一步都没跑** ⇒ 规格门禁 + 双实现对拍**全瞎**
      #     （最坏的一种：门禁"绿"其实是没跑 ⇒ 什么都不知道）⭐
      #
      # ⭐⭐ **改用 runner 自带的 Swift**（macOS job 一直就是这么做的 ⇒ 与镜像同版本）
      #   ⇒ 不用下 800MB，也不用担心系统库版本
      #
      # ⚠️⚠️ **绝对不能混用两套工具链**（本轮又栽了一次）：
      #   `swift`（runner 自带 6.4）驱动时去 PATH 里找 `swift-build`
      #   ⇒ 找下载那套（6.1.2）⇒ **Ubuntu 26.04 没有 `libxml2.so.2`**（apt 里叫 libxml2t64）
      #   ⇒ `swift-build: error while loading shared libraries` ⇒ **exit 127** ⭐
      # ⇒ 所以：**要么全用 runner 的，要么全用下载的** ⇒ 下面按这个来
      - name: 装 Swift 工具链（优先用 runner 自带的 · 缺失才下载官方 tarball）
        run: |
          set -euo pipefail
          if command -v swift >/dev/null 2>&1; then
            echo "✅ 用 runner 自带的 Swift：$(command -v swift)"
          else
            echo "⬇️ runner 没自带 ⇒ 下载官方 tarball（6.1.2 · 与沙盒同版本）"
            SWIFT_VERSION=6.1.2
            BASE="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2204"
            TARBALL="swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04.tar.gz"
            mkdir -p "$HOME/swift-toolchain"
            ok=0
            # ⚠️ **两个 URL 都试** ⇒ swift.org 的目录结构改过（踩过 404）
            for URL in \
              "$BASE/swift-${SWIFT_VERSION}-RELEASE/$TARBALL" \
              "$BASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04/$TARBALL" ; do
              echo "⬇️ 试 $URL"
              if curl -fL --retry 3 --retry-delay 5 -o /tmp/swift.tar.gz "$URL"; then
                ok=1; break
              fi
            done
            [ "$ok" = 1 ] || { echo "❌ 工具链下载失败（swift.org 路径变了？）"; exit 1; }
            tar xzf /tmp/swift.tar.gz -C "$HOME/swift-toolchain" --strip-components=1
            # ⚠️ Ubuntu 24.04+ 的包名加了 **t64** 后缀（libxml2 ⇒ libxml2t64）
            #   ⇒ 两套名字都试 ⇒ 少了 libxml2.so.2 的话 swift-build 直接 exit 127 ⭐
            sudo apt-get update -qq || true
            sudo apt-get install -y --no-install-recommends \
              libxml2t64 libcurl4t64 libsqlite3-0t64 libatomic1 libedit2t64 zlib1g || \
            sudo apt-get install -y --no-install-recommends \
              libxml2 libcurl4 libsqlite3-0 libatomic1 libedit2 zlib1g || true
            export PATH="$HOME/swift-toolchain/usr/bin:$PATH"
            echo "$HOME/swift-toolchain/usr/bin" >> "$GITHUB_PATH"
          fi
          # ⭐ 必须**真的跑一下** ⇒ 装坏了要当场炸，不能悄悄跳过门禁
          swift --version
          swift package --version
          # ⚠️ **两套工具链混用的自检**：`swift` 和 `swift-build` 必须在同一个目录
          echo "swift       → $(command -v swift)"
          echo "swift-build → $(command -v swift-build)"
          [ "$(dirname "$(command -v swift)")" = "$(dirname "$(command -v swift-build)")" ] \
            || { echo "❌ swift 与 swift-build 不在同一套工具链里（会 exit 127）"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 装 jsdom（JS 参考实现需要 DOM）
        run: npm install --no-audit --no-fund

      - name: 编译语义内核
        run: swift build

      - name: 规格门禁（swift test）
        run: swift test

      - name: 双实现对拍（差异 = 债）
        run: bash tools/conformance-diff.sh

      - name: 归档对拍报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance/out/
          if-no-files-found: ignore

  jsc:
    name: JSC 后端（macOS · 只有这里能验 JavaScriptCore）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️⚠️ **不要用 swift-actions 装 Swift**！
      #   macOS runner 的 Xcode 26.6 自带 **SDK 是 Swift 6.3.2 编的**，
      #   而 swift-actions 装的 6.1.2 编译器**认不了这个 SDK** ⇒
      #   「this SDK is not supported by the compiler」⇒ 编 Foundation/Combine 直接炸。
      # ⇒ 改用 **runner 自带的 swift**（跟 SDK 同版本）✅
      - name: 打印工具链版本（确认与 SDK 同版本）
        run: swift --version

      # ⚠️ `swift build 2>&1 | tee` 会**吞掉 exit code**（tee 返回 0）
      #    ⇒ 编译失败也会被标成 success ⇒ 白等一轮 ⇒ 必须 `pipefail`
      - name: 编译语义内核
        run: set -o pipefail; swift build 2>&1 | tee jsc-build.log

      - name: JSC 门禁（Linux 上这些用例会被跳过 ⇒ 只能在这里跑）
        run: set -o pipefail; swift test --filter JSC 2>&1 | tee jsc-test.log

      - name: 归档 JSC 编译日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsc-build-log
          path: |
            jsc-build.log
            jsc-test.log
          if-no-files-found: ignore

  ios:
    name: iOS 编译检查（宿主层 UIKit/WebKit + 整个引擎在 iOS SDK 上）
    # ⚠️⚠️ **这是接宿主 App 前的唯一硬缺口**
    #   `LegadoHostApple` 里的 UIKit / WebKit 代码都在 `#if canImport(...)` 内
    #   ⇒ **Linux 沙盒一个字节都不编译** ⇒ macOS job 也跳过（macOS 没有 UIKit）
    #   ⇒ 只有这个 job 能真正验它们 ⭐
    #
    # ⭐ 顺带的好处：iOS 也有 JavaScriptCore ⇒ 这个 job 会把
    #   **整个引擎（含 JSC 后端）在 iOS SDK 上编译一遍** ⇒ 比 macOS job 更接近真机
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打印 Xcode / iOS SDK
        run: |
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphonesimulator --show-sdk-path)"

      # ⚠️ `| tee` 吞 exit code ⇒ 必须 `pipefail`（同 jsc job 的教训）
      - name: 编译 iOS 目标（模拟器 · 不签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme LegadoHostApple \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios-build.log

      - name: 归档 iOS 编译日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
